# spicelab.cl is a static site. The repository root is the publish
# directory (index.html, _headers, _redirects live here). No build step.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.chat]
  included_files = ["knowledge/spicelab.md", "knowledge/huerto.md", "knowledge/agro-prices.md"]
